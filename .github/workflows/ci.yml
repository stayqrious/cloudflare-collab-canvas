name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  validate:
    if: vars.AUTOMATION_PROVIDER != 'cloudflare' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify generated Worker binding types
        run: npm run cf:types -- --check

  # Pull requests run the browser suite in Chromium and mobile Chromium, which covers the new
  # surface area on every change; a manual dispatch runs every browser project.
  browser:
    if: vars.AUTOMATION_PROVIDER != 'cloudflare' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure Wrangler diagnostic log
        run: echo "WRANGLER_LOG_PATH=$RUNNER_TEMP/spacescale-wrangler.log" >> "$GITHUB_ENV"
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium --only-shell
      - if: github.event_name == 'pull_request'
        run: npm run test:e2e -- --project=chromium --project=mobile-chromium --max-failures=5
      - if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps
      - if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e -- --max-failures=5
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            ${{ runner.temp }}/spacescale-wrangler.log
            playwright-report/
          retention-days: 3
