name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: cloudflare-collab-canvas-${{ github.ref }}-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0
  WRANGLER_VERSION: 4.145.0

jobs:
  # Every push to main deploys, including direct pushes that skipped a pull request, so the
  # full repository check gates both deploy jobs rather than relying on branch protection.
  validate:
    if: vars.AUTOMATION_PROVIDER != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Verify generated Worker binding types
        run: npm run cf:types -- --check

  staging:
    needs: validate
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ format('https://{0}', vars.APP_HOSTNAME) }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORGANISATION_SIGNING_KEYS: ${{ secrets.ORGANISATION_SIGNING_KEYS }}
      SESSION_SIGNING_KEY_CURRENT: ${{ secrets.SESSION_SIGNING_KEY_CURRENT }}
      SESSION_SIGNING_KEY_PREVIOUS: ${{ secrets.SESSION_SIGNING_KEY_PREVIOUS }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
      R2_BUCKET_JURISDICTION: ${{ vars.R2_BUCKET_JURISDICTION }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      BOARD_CREATION_ENABLED: "true"
      TURNSTILE_ENABLED: "false"
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      WEBHOOK_ALLOWED_ORIGINS: ${{ vars.WEBHOOK_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the staging Cloudflare account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the staging Cloudflare API token}"
          : "${ORGANISATION_SIGNING_KEYS:?Configure the staging Organisation key registry}"
          : "${SESSION_SIGNING_KEY_CURRENT:?Configure the staging session signing key}"
          : "${DEPLOYMENT_NAME:?Configure the staging deployment name}"
          : "${APP_HOSTNAME:?Configure the staging application hostname}"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "$WRANGLER_VERSION"

      - name: Deploy staging
        run: npm run deployment:deploy -- --env staging

  production:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ format('https://{0}', vars.APP_HOSTNAME) }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORGANISATION_SIGNING_KEYS: ${{ secrets.ORGANISATION_SIGNING_KEYS }}
      SESSION_SIGNING_KEY_CURRENT: ${{ secrets.SESSION_SIGNING_KEY_CURRENT }}
      SESSION_SIGNING_KEY_PREVIOUS: ${{ secrets.SESSION_SIGNING_KEY_PREVIOUS }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
      R2_BUCKET_JURISDICTION: ${{ vars.R2_BUCKET_JURISDICTION }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      BOARD_CREATION_ENABLED: "true"
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      WEBHOOK_ALLOWED_ORIGINS: ${{ vars.WEBHOOK_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the production Cloudflare account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the production Cloudflare API token}"
          : "${ORGANISATION_SIGNING_KEYS:?Configure the production Organisation key registry}"
          : "${SESSION_SIGNING_KEY_CURRENT:?Configure the production session signing key}"
          : "${TURNSTILE_SECRET_KEY:?Configure the production Turnstile secret key}"
          : "${DEPLOYMENT_NAME:?Configure the production deployment name}"
          : "${APP_HOSTNAME:?Configure the production application hostname}"
          : "${TURNSTILE_SITE_KEY:?Configure the production Turnstile site key}"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "$WRANGLER_VERSION"

      - name: Deploy production
        run: npm run deployment:deploy -- --env production
