name: Deploy

# Cloudflare Workers Builds deploys this repository directly from its connected
# branch. Two deployers pointed at one Worker race each other, so this workflow
# is dispatch-only until that connection is removed.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: cloudflare-collab-canvas-${{ github.ref }}-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0
  WRANGLER_VERSION: 4.118.0

jobs:
  staging:
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ format('https://{0}', vars.APP_HOSTNAME) }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORGANISATION_SIGNING_KEYS: ${{ secrets.ORGANISATION_SIGNING_KEYS }}
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
      R2_BUCKET_JURISDICTION: ${{ vars.R2_BUCKET_JURISDICTION }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      BOARD_CREATION_ENABLED: "true"
      TURNSTILE_ENABLED: "false"
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      WEBHOOK_ALLOWED_ORIGINS: ${{ vars.WEBHOOK_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the staging Cloudflare account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the staging Cloudflare API token}"
          : "${ORGANISATION_SIGNING_KEYS:?Configure the staging Organisation key registry}"
          : "${DEPLOYMENT_NAME:?Configure the staging deployment name}"
          : "${APP_HOSTNAME:?Configure the staging application hostname}"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "$WRANGLER_VERSION"

      - name: Initialize staging resources
        run: npm run deployment:init -- --env staging

      - run: npm run build:web

      - name: Upload staging Worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wrangler-staging-upload.jsonl"
          secrets_file="$RUNNER_TEMP/wrangler-staging-secrets.json"
          jq -n --arg registry "$ORGANISATION_SIGNING_KEYS" \
            '{ORGANISATION_SIGNING_KEYS: $registry}' > "$secrets_file"
          chmod 600 "$secrets_file"
          WRANGLER_OUTPUT_FILE_PATH="$output" npx --no-install wrangler versions upload \
            --config .generated/wrangler.staging.jsonc \
            --secrets-file "$secrets_file" \
            --tag "staging-${GITHUB_SHA:0:12}" \
            --message "staging ${GITHUB_SHA}"
          version="$(jq -r 'select(.type == "version-upload") | .version_id' "$output" | tail -n 1)"
          test -n "$version"
          test "$version" != "null"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy staging version at 100%
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler versions deploy \
            "${{ steps.upload.outputs.version_id }}@100" \
            --config .generated/wrangler.staging.jsonc \
            --yes \
            --message "staging ${GITHUB_SHA}"

      - name: Finalize staging Custom Domain
        run: npm run deployment:init -- --env staging --finalize

      - name: Probe staging health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "https://${APP_HOSTNAME}/healthz?deploy=${GITHUB_RUN_ID}-${attempt}" |
              jq -e '.ok == true and .service == "cloudflare-collab-canvas-edge"' >/dev/null
            then
              exit 0
            fi
            sleep 3
          done
          echo "Staging health probe failed" >&2
          exit 1

  production:
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ format('https://{0}', vars.APP_HOSTNAME) }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORGANISATION_SIGNING_KEYS: ${{ secrets.ORGANISATION_SIGNING_KEYS }}
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
      R2_BUCKET_JURISDICTION: ${{ vars.R2_BUCKET_JURISDICTION }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      BOARD_CREATION_ENABLED: "true"
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      WEBHOOK_ALLOWED_ORIGINS: ${{ vars.WEBHOOK_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the production Cloudflare account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the production Cloudflare API token}"
          : "${ORGANISATION_SIGNING_KEYS:?Configure the production Organisation key registry}"
          : "${DEPLOYMENT_NAME:?Configure the production deployment name}"
          : "${APP_HOSTNAME:?Configure the production application hostname}"
          : "${TURNSTILE_SITE_KEY:?Configure the production Turnstile site key}"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "$WRANGLER_VERSION"

      - name: Initialize production resources
        run: npm run deployment:init -- --env production

      - run: npm run build:web

      - name: Upload production Worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wrangler-production-upload.jsonl"
          secrets_file="$RUNNER_TEMP/wrangler-production-secrets.json"
          jq -n --arg registry "$ORGANISATION_SIGNING_KEYS" \
            '{ORGANISATION_SIGNING_KEYS: $registry}' > "$secrets_file"
          chmod 600 "$secrets_file"
          WRANGLER_OUTPUT_FILE_PATH="$output" npx --no-install wrangler versions upload \
            --config .generated/wrangler.production.jsonc \
            --secrets-file "$secrets_file" \
            --tag "main-${GITHUB_SHA:0:12}" \
            --message "production ${GITHUB_SHA}"
          version="$(jq -r 'select(.type == "version-upload") | .version_id' "$output" | tail -n 1)"
          test -n "$version"
          test "$version" != "null"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy production version at 100%
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler versions deploy \
            "${{ steps.upload.outputs.version_id }}@100" \
            --config .generated/wrangler.production.jsonc \
            --yes \
            --message "production ${GITHUB_SHA}"

      - name: Finalize production Custom Domain
        run: npm run deployment:init -- --env production --finalize

      - name: Probe production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "https://${APP_HOSTNAME}/healthz?deploy=${GITHUB_RUN_ID}-${attempt}" |
              jq -e '.ok == true and .service == "cloudflare-collab-canvas-edge"' >/dev/null
            then
              exit 0
            fi
            sleep 3
          done
          echo "Production health probe failed" >&2
          exit 1
